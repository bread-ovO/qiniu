name: AI Fix Verify

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA generated by the AI fix agent
        required: true
        type: string
      commands:
        description: Newline-separated verification commands inferred by the AI fix agent
        required: true
        type: string

permissions:
  contents: read
  checks: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fixed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verification commands
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r command; do
            if [ -z "$command" ]; then
              continue
            fi
            echo "::group::$command"
            bash -lc "$command"
            echo "::endgroup::"
          done <<'COMMANDS'
          ${{ inputs.commands }}
          COMMANDS
